<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-variant: small-caps;
        }
        body{
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header, footer{
            text-align: center;
            background-color: #FFB100;
        }
        main{
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin-top: 2.5rem;
        }
        .container{
            width: 350px;
            height: 300px;
            background-color: rgba(0, 0, 0, 0.801);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 30px;
            border-radius: 25px;
        }
        .number{
            padding: 10px;
            width: 50px;
            text-align: center;
            font-size: 2rem;
        }

        .btn{
            padding: 10px;
        }
        .btnContador{
            padding: 2px;
            width: 3rem;
            font-weight: bold;
            font-size: 1.5rem;
            background-color: #FFB100;
            color: black;
        }
        .btnReset{
            padding: 6px;
            background-color: black;
            color: #FFB100;
            border: 1px solid black;
            border-radius: 7px;
            font-size: 1.2rem;
        }
        .btnReset:hover{
            background-color: #FFB100;
            color: black;
        }

    </style>
</head>

<body>
    
    <header>
        <h1>Contador</h1>
    </header>

    <main>

        <div class="container">

            <div class="number" id="nbr">
                <h1 id="number">0</h1>
            </div>

            <div class="btn">
                
                <button class="btnContador" id="btnMenor" onclick="contadorMenor()">-</button>

                <button class="btnContador" id="btnMaior" onclick="contadorMaior()">+</button>

            </div>

            <div >
                <button class="btnReset" id="btnReset" onclick="limparContador()">Limpar</button>
            </div>

        </div>

    </main>

    <footer>
        <p>Desenvolvido por <strong>Gustavo Ramos</strong>.</p>
    </footer>

    <script defer>
        let number = document.getElementById('number')
        let btnMenor = document.getElementById('btnMenor')
        let btnMaior = document.getElementById('btnMaior')
        let btnReset = document.getElementById('btnReset')

        let n = 0

        function contadorMaior(){
            n++
            number.innerHTML = n
        }

        function contadorMenor(){
            if (n > 0){
            n--
            number.innerHTML = n
            }
        }

        function limparContador(){
            n = 0
            number.innerHTML = n
        }
    </script>
</body>

</html>
