<!DOCTYPE html>

<html lang="en">

<head>
    <title>localStorage</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header{
            background-color: #ffb300;
            text-align: center;
        }
        main{
            flex-grow: 1;
            display: flex;
            flex-direction: column; 
            justify-content: flex-start;
            align-items: flex-start;
            gap: 10px;
        }
        button{
            padding: 5px;
            font-size: 0.90rem;
            margin: 10px 5px 5px 5px;
            background-color: rgb(0, 117, 212);
            border: none;
            border-radius: 7px;
            color: white;
            cursor: pointer;
        }
         button:hover{
            background-color: rgb(2, 131, 236);
        }
        input{
            padding: 5px;
            margin: 0 5px;
            border: 1px solid rgb(0, 117, 212);
            border-radius: 7px;
            background-color: rgb(240, 240, 240);
            font-size: 0.90rem;
            outline: none;
            
        }
        footer{
            background-color: #ffb300;
            text-align: center;
        }
    </style>
</head>

<body>
    
    <header>
        <h1>localStorage</h1>
    </header>

    <main>

        <button>Adicionar</button>

        <input type="text" placeholder="Digite o seu nome">

        <br>

        <ul id="msg">

        </ul>

    </main>

    <footer>
        <p>Desenvolvido por <strong>Gustavo Ramos</strong>.</p>
    </footer>

    <script defer>

        'use strict';

        let btnAdicionar = document.querySelector('button');
        let inputNome = document.querySelector('input');
        let msg = document.getElementById('msg');

        btnAdicionar.addEventListener('click',adicionarUsuario)

        function adicionarUsuario(){
            let nome = inputNome.value
            let li = document.createElement('li');
            li.textContent = nome;
            li.style.padding = '5px';
            li.style.fontSize = '0.90rem';
            li.style.borderBottom = '1px solid rgb(0, 117, 212)';
            msg.appendChild(li);
            
        }

    </script>

</body>

</html>
