<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreateElement</title>
</head>

<body>
    
    <script defer>

       document.body.style.backgroundColor = "rgb(18, 148, 255)";

       let novoElemento = document.createElement('div')

       document.body.appendChild(novoElemento)

       novoElemento.style.width = "200px"
       novoElemento.style.height = "200px"
       novoElemento.style.backgroundColor = "white"
       novoElemento.style.borderRadius = '20px'

       novoElemento.addEventListener('click', mudarCor)

       function mudarCor(){
        if(novoElemento.style.backgroundColor == 'white'){
            novoElemento.style.backgroundColor = 'red'
        }else{
            novoElemento.style.backgroundColor = 'white'
        }
       }
       
    </script>
    
</body>

</html>
