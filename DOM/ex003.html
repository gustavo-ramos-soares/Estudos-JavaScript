<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-variant: small-caps;
        }
        body{
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header, footer{
            text-align: center;
            background-color: #FFB100;
        }
        main{
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin-top: 2.5rem;
        }
        .container{
            width: 350px;
            height: 250px;
            background-color: rgba(0, 0, 0, 0.801);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 30px;
            border-radius: 25px;
        }
        .number{
            padding: 10px;
            width: 50px;
            text-align: center;
        }

        .btn{
            padding: 10px;
        }
        .btnContador{
            padding: 2px;
            width: 3rem;
            font-weight: bold;
            background-color: #FFB100;
            color: black;
        }
        .btnReset{
            padding: 6px;
            background-color: black;
            color: #FFB100;
            border: 1px solid black;
            border-radius: 7px;
        }
        .btnReset:hover{
            background-color: #FFB100;
            color: black;
        }

    </style>
</head>

<body>
    
    <header>
        <h1>Contador</h1>
    </header>

    <main>

        <div class="container">

            <div class="number" id="number">
                <h1>0</h1>
            </div>

            <div class="btn">
                
                <button class="btnContador">-</button>

                <button class="btnContador">+</button>

            </div>

            <div >
                <button class="btnReset">Limpar</button>
            </div>

        </div>

    </main>

    <footer>
        <p>Desenvolvido por <strong>Gustavo Ramos</strong>.</p>
    </footer>

    <script defer>

    </script>
</body>

</html>
