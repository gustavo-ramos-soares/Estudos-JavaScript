<!DOCTYPE html>

<html lang="pt-br">

<head>
    <title>Super contador</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #0A4363;
        }

        header {
            color: whitesmoke;
            text-align: center;
        }

        div {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 8px;
        }

        footer {
            color: whitesmoke;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <h1>Tabuada</h1>
    </header>

    <section>

        <div>

            <p>
                <label for="nInicio">Numero:</label>
                <input type="number" name="number" id="number">

                <input type="button" value="Gerar Tabuada" onclick="gerarTabuada()">
            </p>

        </div>


        <div id="msgContador">
            <select name="tabuada" id="selTab" size="10">
                <option>
                    Digite um número acima
                </option>
            </select>
        </div>

    </section>

    <footer>
        <p>Desenvolvido por <strong>Gustavo Ramos</strong> </p>
    </footer>

    <script defer>

        function gerarTabuada() {

            let number = document.getElementById('number').value
            let tab = document.getElementById('selTab')

            if (number.length == 0) {
                alert('Por favor, digite um número!')
            } else {
                let num = Number(number)
                let c = 1
                tab.innerHTML = ''

                while (c <= 10) {
                    let item = document.createElement('option')
                    item.text = `${num} x ${c} = ${num * c}`
                    item.value = `tab${c}`
                    tab.appendChild(item)
                    c++
                }

            }
        }

    </script>

</body>

</html>
