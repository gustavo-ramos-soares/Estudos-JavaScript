<!DOCTYPE html>

<html lang="pt-br">

<head>
    <title>Calculadora de Idade</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    
    <header>
        <h1>Calculadora de Idade</h1>
    </header>

    <section>
        
        <div>

            <p>
                <label for="iDate">Insira sua data de nascimento:</label>
                <br>
                <input type="date" name="iDate" id="iDate">
            </p>

            <p>
                <input type="button" value="Calcular" id="btnCalcular" class="btnCalcular" onclick="calcularIdade()">
            </p>

        </div>

        <div id="boxMsg">
            
        </div>

    </section>

    <footer>
        <p>Desenvolvido por <a href="##" target="_blank">Gustavo Ramos</a></p>
    </footer>

</html>
